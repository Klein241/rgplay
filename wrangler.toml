# ============================================================
# wrangler.toml - Configuration Cloudflare Pages & Workers RG Play
# Account ID  : 0c6536b2366b6a388b4d6a4d331d486e
# Subdomain   : rgplay.workers.dev
# Pages URL   : https://rg-play.pages.dev
# ============================================================
name = "rg-play"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./dist"

# ============================================================
# Bindings Cloudflare D1 SQL Database
# ============================================================
[[d1_databases]]
binding = "DB"
database_name = "rgplay"
database_id = "edbf4f75-abda-465c-9b95-4409d10b3993"
migrations_dir = "./migrations"

# ============================================================
# Bindings Cloudflare R2 Audio & Cover Storage
# ============================================================
[[r2_buckets]]
binding = "AUDIO_BUCKET"
bucket_name = "rg-play-audio"

# ============================================================
# Bindings Cloudflare KV (Cache & Sessions)
# ============================================================
[[kv_namespaces]]
binding = "KV_BINDING"
id = "e35fb6a66d92422993509a3d7aa53f5c"

# ============================================================
# Variables d'environnement Production
# ============================================================
[vars]
ENVIRONMENT = "production"
APP_NAME = "RG Play Audiobooks"
APP_URL = "https://rg-play.pages.dev"
WORKERS_SUBDOMAIN = "rgplay.workers.dev"
CLOUDFLARE_ACCOUNT_ID = "0c6536b2366b6a388b4d6a4d331d486e"
R2_S3_ENDPOINT = "https://0c6536b2366b6a388b4d6a4d331d486e.r2.cloudflarestorage.com"
R2_BUCKET_NAME = "rg-play-audio"
PAYMENT_GATEWAY_URL = "https://camerpay.biz/api/payment/initiate"
PAYMENT_HMAC_SECRET = "fdc754e525e417261465dcda8caabdc7360395b0ef1934c5"
DEFAULT_CURRENCY = "XAF"
